# MIME de .mjs no Nginx (worker do PDF.js)
#
# Sintoma no browser: "Não foi possível abrir o PDF" com
# Setting up fake worker failed: Failed to fetch dynamically imported module
# .../build/assets/pdf.worker.min-*.mjs
#
# Causa: o mime.types do Nginx (Ubuntu) não mapeia .mjs. O ficheiro é
# servido como application/octet-stream e o browser recusa o import().
#
# Este bloco `types` no contexto http (conf.d) junta-se ao mime.types;
# não substitui os tipos existentes.
#
# Script: bash deployment/apply-upload-limits.sh

types {
    application/javascript mjs;
}
